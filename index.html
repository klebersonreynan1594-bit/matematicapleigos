<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — MatemáticaPro</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial;background:linear-gradient(135deg,#111827,#1f2937)}.card{width:min(92vw,410px);background:#fff;padding:30px;border-radius:20px;box-shadow:0 20px 60px #0006}h1{text-align:center;margin:0 0 8px}.sub{text-align:center;color:#6b7280;margin-bottom:24px}.tabs{display:flex;gap:8px}.tabs button{flex:1}button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;font-weight:700}.secondary{background:#e5e7eb;color:#111827}label{display:block;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}.msg{min-height:20px;margin-top:14px;text-align:center;color:#b91c1c}</style></head>
<body><div class="card"><h1>📚 MatemáticaPro</h1><div class="sub">Teste de login e progresso individual</div>
<div class="tabs"><button id="btnLogin">Entrar</button><button id="btnCad" class="secondary">Criar conta</button></div>
<form id="loginForm"><label>Usuário</label><input id="lu" required><label>Senha</label><input id="lp" type="password" required><button>Entrar</button></form>
<form id="cadForm" style="display:none"><label>Novo usuário</label><input id="cu" required><label>Senha</label><input id="cp" type="password" minlength="4" required><button>Criar conta</button></form><div class="msg" id="msg"></div></div>
<script>
const USERS='matpro_users',SESSION='matpro_session';const get=()=>JSON.parse(localStorage.getItem(USERS)||'{}');const save=x=>localStorage.setItem(USERS,JSON.stringify(x));const msg=x=>document.getElementById('msg').textContent=x;const go=()=>location.href='curso.html';
btnLogin.onclick=()=>{loginForm.style.display='block';cadForm.style.display='none';msg('')};btnCad.onclick=()=>{loginForm.style.display='none';cadForm.style.display='block';msg('')};
cadForm.onsubmit=e=>{e.preventDefault();const u=cu.value.trim(),p=cp.value,d=get();if(d[u])return msg('Esse usuário já existe.');d[u]={senha:p,progresso:{}};save(d);localStorage.setItem(SESSION,u);go()};
loginForm.onsubmit=e=>{e.preventDefault();const u=lu.value.trim(),p=lp.value,d=get();if(!d[u]||d[u].senha!==p)return msg('Usuário ou senha incorretos.');localStorage.setItem(SESSION,u);go()};
</script></body></html>
