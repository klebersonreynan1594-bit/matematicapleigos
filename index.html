<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - MatemáticaPro</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #475569;
      border-radius: 10px;
      background: #0f172a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #mensagem {
      margin-top: 18px;
      text-align: center;
      min-height: 22px;
      color: #f87171;
    }

    .info {
      margin-top: 24px;
      padding: 14px;
      background: #0f172a;
      border-radius: 10px;
      color: #94a3b8;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      📚 MatemáticaPro
    </div>

    <div class="subtitle">
      Área exclusiva dos alunos
    </div>

    <form id="loginForm">

      <label for="email">
        E-mail
      </label>

      <input
        type="email"
        id="email"
        placeholder="Digite seu e-mail"
        autocomplete="email"
        required
      >

      <label for="senha">
        Senha
      </label>

      <input
        type="password"
        id="senha"
        placeholder="Digite sua senha"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="btnLogin">
        Entrar
      </button>

    </form>

    <div id="mensagem"></div>

    <div class="info">
      O acesso é exclusivo para alunos cadastrados.
      <br>
      Para solicitar uma conta, entre em contato com o administrador.
    </div>

  </div>

<script>

  // ==========================================
  // CONFIGURAÇÃO DO SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://uefdmsafyogunnrvhljv.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Cct4J1njgu6rSkPPuqEOCQ_vhSS89Pa";


  const { createClient } =
    supabase;

  const supabaseClient =
    createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // ELEMENTOS DA PÁGINA
  // ==========================================

  const loginForm =
    document.getElementById("loginForm");

  const emailInput =
    document.getElementById("email");

  const senhaInput =
    document.getElementById("senha");

  const btnLogin =
    document.getElementById("btnLogin");

  const mensagem =
    document.getElementById("mensagem");


  // ==========================================
  // VERIFICAR SE JÁ ESTÁ LOGADO
  // ==========================================

  verificarSessao();


  async function verificarSessao() {

    const {
      data,
      error
    } = await supabaseClient.auth.getSession();

    if (error) {
      console.error(error);
      return;
    }

    if (data.session) {

      window.location.href =
        "curso.html";

    }

  }


  // ==========================================
  // LOGIN
  // ==========================================

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      mensagem.textContent = "";

      btnLogin.disabled = true;
      btnLogin.textContent = "Entrando...";


      const email =
        emailInput.value.trim();

      const senha =
        senhaInput.value;


      const {
        data,
        error
      } = await supabaseClient.auth.signInWithPassword({

        email: email,

        password: senha

      });


      if (error) {

        console.error(error);

        mensagem.textContent =
          "E-mail ou senha incorretos.";

        btnLogin.disabled = false;
        btnLogin.textContent = "Entrar";

        return;
      }


      // Login realizado

      mensagem.style.color =
        "#4ade80";

      mensagem.textContent =
        "Login realizado!";


      setTimeout(function() {

        window.location.href =
          "curso.html";

      }, 500);

    }
  );

</script>

</body>
</html>
