<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - MatemáticaPro</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #111827;
      border: 1px solid #263247;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d1d5db;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #0b1220;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #3b82f6;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #mensagem {
      margin-top: 18px;
      text-align: center;
      min-height: 22px;
      color: #f87171;
    }

    .logo {
      text-align: center;
      font-size: 45px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">📚</div>

    <h1>MatemáticaPro</h1>

    <p class="subtitle">
      Entre para acessar o curso
    </p>

    <form id="loginForm">

      <label for="email">E-mail</label>

      <input
        type="email"
        id="email"
        placeholder="Digite seu e-mail"
        required
      >

      <label for="senha">Senha</label>

      <input
        type="password"
        id="senha"
        placeholder="Digite sua senha"
        required
      >

      <button type="submit" id="btnLogin">
        Entrar
      </button>

    </form>

    <div id="mensagem"></div>

  </div>


  <script>

    // ==========================================
    // CONFIGURAÇÃO DO SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://uefdmsafyogunnrvhljv.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Cct4J1njgu6rSkPPuqEOCQ_vhSS89Pa";


    const { createClient } =
      supabase;

    const db = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // ==========================================
    // ELEMENTOS DA PÁGINA
    // ==========================================

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const senhaInput =
      document.getElementById("senha");

    const btnLogin =
      document.getElementById("btnLogin");

    const mensagem =
      document.getElementById("mensagem");


    // ==========================================
    // VERIFICAR SE JÁ ESTÁ LOGADO
    // ==========================================

    async function verificarSessao() {

      const {
        data: { session }
      } = await db.auth.getSession();

      if (session) {

        // Já está logado:
        // manda direto para o curso.

        window.location.href = "curso.html";
      }
    }

    verificarSessao();


    // ==========================================
    // LOGIN
    // ==========================================

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        mensagem.textContent = "";

        btnLogin.disabled = true;
        btnLogin.textContent = "Entrando...";


        const email =
          emailInput.value.trim();

        const senha =
          senhaInput.value;


        // ======================================
        // AUTENTICAÇÃO PELO SUPABASE
        // ======================================

        const {
          data,
          error
        } = await db.auth.signInWithPassword({

          email: email,

          password: senha

        });


        // ======================================
        // ERRO
        // ======================================

        if (error) {

          console.error(error);

          mensagem.textContent =
            "E-mail ou senha incorretos.";

          btnLogin.disabled = false;
          btnLogin.textContent = "Entrar";

          return;
        }


        // ======================================
        // LOGIN REALIZADO
        // ======================================

        if (data.session) {

          mensagem.style.color = "#4ade80";

          mensagem.textContent =
            "Login realizado! Entrando no curso...";


          // Pequeno intervalo para mostrar
          // a mensagem antes do redirecionamento.

          setTimeout(function() {

            window.location.href =
              "curso.html";

          }, 500);

        }

      }
    );

  </script>

</body>
</html>
