<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Aula 01 - Operações Fundamentais</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#0b1220;
    color:#fff;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

/* =========================================================
   TOPO
========================================================= */

.top-nav{
    margin-bottom:18px;
}

.back{
    color:#60a5fa;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
}


/* =========================================================
   CABEÇALHO
========================================================= */

.header,
.card{
    background:#111827;
    border:1px solid #263244;
    border-radius:20px;
}

.header{
    text-align:center;
    padding:28px 20px;
    margin-bottom:18px;
}

.lesson-number{
    color:#60a5fa;
    font-size:14px;
    font-weight:800;
    letter-spacing:1px;
    margin-bottom:8px;
}

h1{
    font-size:28px;
    line-height:1.2;
    margin-bottom:8px;
}

.subtitle{
    color:#9ca3af;
    font-size:15px;
}


/* =========================================================
   CARDS
========================================================= */

.card{
    padding:22px;
    margin-bottom:18px;
}

.card h2{
    font-size:20px;
    margin-bottom:14px;
}


/* =========================================================
   VÍDEO DO YOUTUBE
========================================================= */

.video{
    width:100%;
    aspect-ratio:16 / 9;
    display:block;
    border:0;
    border-radius:14px;
    background:#000;
}


/* =========================================================
   BOTÕES DOS MATERIAIS
========================================================= */

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.btn{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    text-decoration:none;
    background:#2563eb;
    color:#fff;
    padding:16px;
    border-radius:12px;
    font-weight:800;
    font-size:15px;
    min-height:54px;
    transition:.2s;
}

.btn:hover{
    background:#1d4ed8;
}

.btn:active{
    transform:scale(.98);
}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

.navigation{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.nav-btn{
    display:block;
    text-decoration:none;
    background:#111827;
    color:#fff;
    border:1px solid #263244;
    border-radius:14px;
    padding:15px;
    font-weight:700;
}

.nav-btn.next{
    text-align:right;
}

.nav-label{
    display:block;
    color:#60a5fa;
    font-size:12px;
    margin-bottom:5px;
}


/* =========================================================
   RODAPÉ
========================================================= */

.footer{
    text-align:center;
    color:#6b7280;
    font-size:12px;
    padding:20px 0 8px;
}


/* =========================================================
   CELULAR
========================================================= */

@media(max-width:600px){

    body{
        padding:14px;
    }

    h1{
        font-size:23px;
    }

    .buttons,
    .navigation{
        grid-template-columns:1fr;
    }

    .nav-btn.next{
        text-align:left;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- ========================================================
     VOLTAR PARA O CURSO
========================================================= -->

<div class="top-nav">

    <a

    </a>

</div>


<!-- ========================================================

========================================================= -->

<header class="header">

    <div class="lesson-number">

        AULA 01

    </div>


    <h1>

        Operações Fundamentais

    </h1>


    <p class="subtitle">

        Operações e expressões numéricas

    </p>

</header>


<!-- ========================================================
     VÍDEO
========================================================= -->

<section class="card">

    <h2>

        🎥 Aula em vídeo

    </h2>


    <iframe

        class="video"

        src="https://www.youtube.com/embed/QrMBCeNIHsw"

        title="Aula 01 - Operações Fundamentais"

        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

        allowfullscreen>

    </iframe>

</section>


<!-- ========================================================
     MATERIAIS
========================================================= -->

<section class="card">

    <h2>

        📚 Material da aula

    </h2>


    <div class="buttons">


        <a

            class="btn"

            href="aula01teoria.pdf"

            target="_blank">

            📖 Material teórico

        </a>


        <a

            class="btn"

            href="aula01.pdf"

            target="_blank">

            📝 Resolver exercícios

        </a>


    </div>

</section>


<!-- ========================================================
     NAVEGAÇÃO
========================================================= -->

<div class="navigation">


    <!-- Não existe aula anterior -->

    <div></div>


    <a

        class="nav-btn next"

        href="aula02.html">

        <span class="nav-label">

            PRÓXIMA AULA →

        </span>

        Aula 02

    </a>


</div>


<!-- ========================================================
     RODAPÉ
========================================================= -->

<div class="footer">

    Matemática para Leigos • Matemática Básica

</div>


</div>


<!-- ========================================================
     SISTEMA DE ACESSO
     
     NÃO USA SUPABASE.
     
     O login.html deve fazer:
     
     sessionStorage.setItem("alunoLogado","true");

========================================================= -->

<script>

function verificarAcesso(){

    const logado =
        sessionStorage.getItem("alunoLogado");


    if(logado !== "true"){

        window.location.replace("login.html");

        return;

    }

}


/* Verificar acesso ao abrir a aula */

verificarAcesso();

</script>


</body>

</html>
