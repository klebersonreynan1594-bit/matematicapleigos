<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Aula 01 - Operações Fundamentais</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


/* =========================================================
   BODY
========================================================= */

body{

    font-family:Arial,sans-serif;

    background:#0b1220;

    color:white;

    padding:25px;

}


/* =========================================================
   CONTAINER
========================================================= */

.container{

    max-width:800px;

    margin:auto;

}


/* =========================================================
   BOTÃO VOLTAR
========================================================= */

.voltar{

    display:inline-block;

    text-decoration:none;

    color:white;

    background:#1e293b;

    padding:14px 20px;

    border-radius:12px;

    margin-bottom:25px;

    transition:.2s;

}


.voltar:hover{

    background:#263449;

}


/* =========================================================
   CABEÇALHO
========================================================= */

header{

    text-align:center;

    margin:20px 0 30px;

}


.numero{

    color:#60a5fa;

    font-weight:bold;

    margin-bottom:10px;

}


h1{

    font-size:32px;

}


.sub{

    color:#94a3b8;

    margin-top:10px;

}


/* =========================================================
   CARDS
========================================================= */

.card{

    background:#111827;

    border:1px solid #263244;

    border-radius:20px;

    padding:25px;

    margin-bottom:20px;

}


.card h2{

    margin-bottom:15px;

}


/* =========================================================
   VÍDEO DO YOUTUBE
========================================================= */

.video{

    width:100%;

    aspect-ratio:16 / 9;

    display:block;

    border:none;

    border-radius:15px;

    background:#000;

}


/* =========================================================
   BOTÕES
========================================================= */

.botao{

    display:block;

    text-align:center;

    text-decoration:none;

    color:white;

    background:#2563eb;

    padding:16px;

    border-radius:12px;

    margin-top:15px;

    font-weight:bold;

    transition:.2s;

}


.botao:hover{

    background:#1d4ed8;

}


.botao:active{

    transform:scale(.98);

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

.nav{

    display:flex;

    justify-content:space-between;

    gap:10px;

}


.nav a{

    display:inline-block;

    text-decoration:none;

    color:white;

    background:#1e293b;

    padding:14px 20px;

    border-radius:12px;

    transition:.2s;

}


.nav a:hover{

    background:#263449;

}


/* =========================================================
   CELULAR
========================================================= */

@media(max-width:600px){

    body{

        padding:14px;

    }


    h1{

        font-size:26px;

    }


    .card{

        padding:20px;

    }


    .nav{

        flex-direction:column;

    }


    .nav a{

        text-align:center;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- ========================================================
     VOLTAR PARA O CURSO
========================================================= -->

<a href="curso.html"
   class="voltar">

========================================================= -->

<header>

        AULA 01

    </div>


    <h1>

        Operações Fundamentais

    </h1>


    <p class="sub">

        Operações e expressões numéricas

    </p>

</header>


<!-- ========================================================
     VÍDEO
========================================================= -->

<div class="card">

    <h2>

        🎥 Vídeo da aula

    </h2>


    <iframe

        class="video"

        src="https://www.youtube.com/embed/QrMBCeNIHsw"

        title="Aula 01 - Operações Fundamentais"

        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

        allowfullscreen>

    </iframe>

</div>


<!-- ========================================================

========================================================= -->

<div class="card">

    <h2>

        📚 Material da aula

    </h2>


    <a

        class="botao"

        href="aula01teoria.pdf"

    <a

        class="botao"

    </a>

</div>


<!-- ========================================================

========================================================= -->

<div class="nav">

    <span></span>


    <a href="aula02.html">

        Aula 02 →

    </a>

</div>


</div>


<!-- ========================================================
     VERIFICAÇÃO DE ACESSO
     
     Usa o MESMO sistema do curso.html:
     
     sessionStorage.setItem("alunoLogado","true");

========================================================= -->

<script>

function verificarAcesso(){

    const logado =
        sessionStorage.getItem("alunoLogado");


    if(logado !== "true"){

        window.location.replace("login.html");

        return;

    }

}


/* =========================================================
   INICIAR VERIFICAÇÃO
========================================================= */

verificarAcesso();

</script>
