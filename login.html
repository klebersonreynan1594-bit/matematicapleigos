<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Matemática para Leigos</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0b1220;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #111827;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .icone {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 28px;
            font-size: 14px;
        }

        label {
            display: block;
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 17px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #3b82f6;
        }

        .botao-principal {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #3b82f6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 4px;
        }

        .botao-principal:hover {
            background: #2563eb;
        }

        .botao-principal:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .trocar {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            border: none;
            background: transparent;
            color: #60a5fa;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-align: center;
            cursor: pointer;
        }

        .trocar:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        .mensagem {
            min-height: 24px;
            margin-top: 16px;
            text-align: center;
            color: #fbbf24;
            font-size: 14px;
            line-height: 1.5;
        }

        .voltar {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
        }

        .voltar:hover {
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icone">π</div>

        <h1 id="titulo">Entrar</h1>

        <p class="subtitulo">
            Matemática para Leigos
        </p>

        <form id="formulario">

            <label for="email">E-mail</label>

            <input
                type="email"
                id="email"
                placeholder="seuemail@gmail.com"
                autocomplete="email"
                required
            >

            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                minlength="6"
                required
            >

            <button
                type="submit"
                class="botao-principal"
                id="botao"
            >
                Entrar
            </button>

        </form>

        <p
            class="mensagem"
            id="mensagem"
        ></p>

        <button
            type="button"
            class="trocar"
            id="trocar"
        >
            Ainda não tenho uma conta
        </button>

        <a
            href="index.html"
            class="voltar"
        >
            ← Voltar
        </a>

    </div>


    <script>

        // ==========================================
        // SUPABASE
        // ==========================================

        const SUPABASE_URL =
            "https://ugcrffuabvlgobtfcuxf.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_aCd5M2fKeUlZ6xgFZxefzA_YfxGKznF";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // ==========================================
        // ELEMENTOS
        // ==========================================

        const formulario =
            document.getElementById("formulario");

        const titulo =
            document.getElementById("titulo");

        const botao =
            document.getElementById("botao");

        const trocar =
            document.getElementById("trocar");

        const mensagem =
            document.getElementById("mensagem");


        // ==========================================
        // MODO
        // ==========================================

        let modoCadastro = false;


        // ==========================================
        // TROCAR LOGIN / CADASTRO
        // ==========================================

        trocar.addEventListener("click", function () {

            modoCadastro = !modoCadastro;

            mensagem.textContent = "";

            if (modoCadastro) {

                titulo.textContent = "Criar conta";

                botao.textContent = "Criar conta";

                trocar.textContent =
                    "Já tenho uma conta";

                document
                    .getElementById("senha")
                    .setAttribute(
                        "autocomplete",
                        "new-password"
                    );

            } else {

                titulo.textContent = "Entrar";

                botao.textContent = "Entrar";

                trocar.textContent =
                    "Ainda não tenho uma conta";

                document
                    .getElementById("senha")
                    .setAttribute(
                        "autocomplete",
                        "current-password"
                    );

            }

        });


        // ==========================================
        // FORMULÁRIO
        // ==========================================

        formulario.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const senha =
                    document
                        .getElementById("senha")
                        .value;


                if (!email || !senha) {

                    mensagem.textContent =
                        "Preencha e-mail e senha.";

                    return;
                }


                if (senha.length < 6) {

                    mensagem.textContent =
                        "A senha precisa ter pelo menos 6 caracteres.";

                    return;
                }


                botao.disabled = true;

                mensagem.textContent =
                    "Aguarde...";


                // ======================================
                // CADASTRO
                // ======================================

                if (modoCadastro) {

                    const { data, error } =
                        await supabaseClient.auth.signUp({

                            email: email,

                            password: senha,

                            options: {
                                emailRedirectTo:
                                    window.location.origin +
                                    "/curso.html"
                            }

                        });


                    if (error) {

                        console.error(error);

                        mensagem.textContent =
                            error.message;

                        botao.disabled = false;

                        return;
                    }


                    if (data.session) {

                        mensagem.textContent =
                            "Conta criada! Entrando...";

                        window.location.href =
                            "curso.html";

                    } else {

                        mensagem.textContent =
                            "Conta criada! Verifique seu e-mail para confirmar o cadastro.";

                    }


                    botao.disabled = false;

                    return;
                }


                // ======================================
                // LOGIN
                // ======================================

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({

                        email: email,

                        password: senha

                    });


                if (error) {

                    console.error(error);

                    mensagem.textContent =
                        "E-mail ou senha incorretos.";

                    botao.disabled = false;

                    return;
                }


                if (data.session) {

                    mensagem.textContent =
                        "Login realizado!";

                    setTimeout(function () {

                        window.location.href =
                            "curso.html";

                    }, 300);

                }


                botao.disabled = false;

            }
        );

    </script>

</body>
</html>
