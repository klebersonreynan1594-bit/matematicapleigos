<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Entrar - Matemática para Leigos</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#0b1220;
    color:white;
    font-family:Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.card{
    width:100%;
    max-width:420px;

    background:#111827;

    border:1px solid rgba(255,255,255,.1);

    border-radius:24px;

    padding:35px 25px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.4);
}

.icone{
    width:70px;
    height:70px;

    margin:0 auto 18px;

    border-radius:18px;

    background:rgba(255,255,255,.08);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:36px;
}

h1{
    text-align:center;

    font-size:28px;

    margin-bottom:8px;
}

.subtitulo{
    text-align:center;

    color:#94a3b8;

    margin-bottom:28px;

    font-size:14px;
}

label{
    display:block;

    color:#cbd5e1;

    font-size:14px;

    margin-bottom:7px;
}

input{
    width:100%;

    padding:15px;

    margin-bottom:17px;

    border-radius:12px;

    border:1px solid #334155;

    background:#0f172a;

    color:white;

    font-size:16px;

    outline:none;
}

input:focus{
    border-color:#3b82f6;
}

button{
    cursor:pointer;
}

.botao-principal{
    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#3b82f6;

    color:white;

    font-size:16px;

    font-weight:bold;
}

.botao-principal:hover{
    background:#2563eb;
}

.botao-principal:disabled{
    opacity:.6;

    cursor:wait;
}

.mensagem{
    min-height:24px;

    margin-top:16px;

    text-align:center;

    color:#fbbf24;

    font-size:14px;

    line-height:1.5;
}

.voltar{
    display:block;

    margin-top:18px;

    text-align:center;

    color:#64748b;

    text-decoration:none;

    font-size:13px;
}

.info{
    margin-top:22px;

    padding:12px;

    border-radius:10px;

    background:rgba(59,130,246,.08);

    color:#94a3b8;

    font-size:12px;

    text-align:center;

    line-height:1.5;
}

</style>

</head>

<body>

<div class="card">

    <div class="icone">
        π
    </div>

    <h1>
        Entrar
    </h1>

    <p class="subtitulo">
        Matemática para Leigos
    </p>


    <form id="formulario">

        <label for="email">
            E-mail
        </label>

        <input
            type="email"
            id="email"
            placeholder="seuemail@gmail.com"
            autocomplete="username"
            required
        >


        <label for="senha">
            Senha
        </label>

        <input
            type="password"
            id="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
        >


        <button
            type="submit"
            class="botao-principal"
            id="botao"
        >
            Entrar
        </button>

    </form>


    <p
        class="mensagem"
        id="mensagem"
    ></p>


    <div class="info">

        Acesso exclusivo aos alunos do
        Matemática para Leigos.

    </div>


    <a
        href="index.html"
        class="voltar"
    >
        ← Voltar
    </a>

</div>


<script>

/* ==========================================
   LOGIN PROVISÓRIO
========================================== */

const EMAIL_CORRETO = "aluno@gmail.com";

const SENHA_CORRETA = "123456";


/* ==========================================
   ELEMENTOS
========================================== */

const formulario =
document.getElementById("formulario");

const email =
document.getElementById("email");

const senha =
document.getElementById("senha");

const botao =
document.getElementById("botao");

const mensagem =
document.getElementById("mensagem");


/* ==========================================
   LOGIN
========================================== */

formulario.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const emailDigitado =
            email.value.trim();

        const senhaDigitada =
            senha.value;


        mensagem.textContent = "";


        if(!emailDigitado || !senhaDigitada){

            mensagem.textContent =
                "Preencha e-mail e senha.";

            return;
        }


        botao.disabled = true;

        botao.textContent =
            "Entrando...";


        setTimeout(function(){


            if(
                emailDigitado === EMAIL_CORRETO &&
                senhaDigitada === SENHA_CORRETA
            ){

                /*
                    Marca que o aluno entrou.
                */

                sessionStorage.setItem(
                    "alunoLogado",
                    "true"
                );


                mensagem.style.color =
                    "#4ade80";

                mensagem.textContent =
                    "Acesso autorizado!";


                setTimeout(function(){

                    window.location.href =
                        "curso.html";

                },500);


            }else{

                mensagem.style.color =
                    "#fbbf24";

                mensagem.textContent =
                    "E-mail ou senha incorretos.";

                botao.disabled = false;

                botao.textContent =
                    "Entrar";

            }

        },500);

    }
);

</script>

</body>

</html>
