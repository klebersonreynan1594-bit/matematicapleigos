   ASSUNTOS
============================== */

    padding:0 12px 12px;
}

.assuntos.aberto{

    display:flex;
    align-items:center;
    gap:12px;
    padding:14px;

    background:#ffffff08;

    text-decoration:none;

    border-radius:9px;

.assunto-texto{

.assunto-texto span{

    color:#64748b;
    font-size:11px;
    margin-top:3px;

    height:27px;

/* ==================================================
   GERAR OS MÓDULOS
================================================== */

function gerarCurso(){

    const container =
        document.getElementById("listaModulos");

    let numeroAula = 1;

    modulos.forEach(modulo => {

        const section =
            document.createElement("section");

        section.className = "modulo";

        const titulo =
            document.createElement("div");

        titulo.className = "modulo-titulo";

        titulo.onclick =
            function(){
                abrirModulo(
                    modulo.id,
                    titulo
                );
            };

        titulo.innerHTML = `

            <div class="modulo-icon">
                ${modulo.icone}
            </div>

            <div class="modulo-info">

                <h2>
                    ${modulo.titulo}
                </h2>

                <p>
                    ${modulo.descricao}
                </p>

                <div
                    class="modulo-progresso"
                    id="prog-${modulo.id}"
                >
                    0%
                </div>

            </div>

            <div class="seta">
                ›
            </div>

        `;

        const assuntos =
            document.createElement("div");

        assuntos.className = "assuntos";

        assuntos.id = modulo.id;


        modulo.aulas.forEach(aula => {

            const numero =
                numeroAula;

            const link =
                document.createElement("a");

            link.href =
                `aula${String(numero).padStart(2,"0")}.html`;

            link.className = "assunto";

            link.dataset.aula =
                numero;

            link.innerHTML = `

                <div class="numero">
                    ${String(
                        modulo.aulas.indexOf(aula)+1
                    ).padStart(2,"0")}
                </div>

                <div class="assunto-texto">

                    <strong>
                        ${aula[0]}
                    </strong>

                    <span>
                        ${aula[1]}
                    </span>

                </div>

                <div class="check">
                    ✓
                </div>

            `;


            const check =
                link.querySelector(".check");


            check.onclick =
                function(event){

                    concluir(
                        event,
                        numero
                    );

                };


            assuntos.appendChild(link);

            numeroAula++;

        });


        section.appendChild(titulo);

        section.appendChild(assuntos);

        container.appendChild(section);

    });

}


/* ==================================================
   ABRIR / FECHAR MÓDULO
================================================== */

function abrirModulo(id,elemento){

    const modulo =
        document.getElementById(id);

    const seta =
        elemento.querySelector(".seta");


    if(
        modulo.classList.contains("aberto")
    ){

        modulo.classList.remove("aberto");

        seta.textContent = "›";

    }else{

        modulo.classList.add("aberto");

        seta.textContent = "⌄";

    }

}


/* ==================================================
   CONCLUIR AULA
================================================== */

function concluir(event,aula){

    event.preventDefault();

    event.stopPropagation();


    let concluida =
        JSON.parse(
            localStorage.getItem(
                "aulasConcluidas"
            ) || "[]"
        );


    if(
        concluida.includes(aula)
    ){

        concluida =
            concluida.filter(
                numero => numero !== aula
            );

    }else{

        concluida.push(aula);

    }


    localStorage.setItem(
        "aulasConcluidas",
        JSON.stringify(concluida)
    );


    atualizarProgresso();

}


/* ==================================================
   ATUALIZAR PROGRESSO
================================================== */

function atualizarProgresso(){

    const concluida =
        JSON.parse(
            localStorage.getItem(
                "aulasConcluidas"
            ) || "[]"
        );


    const total =
        modulos.reduce(
            (total,modulo) =>
                total + modulo.aulas.length,
            0
        );


    const quantidade =
        concluida.length;


    const porcentagem =
        total === 0
        ? 0
        : Math.round(
            (quantidade / total) * 100
        );


    document.getElementById(
        "progressoGeral"
    ).textContent =
        porcentagem + "%";


    document.getElementById(
        "barraGeral"
    ).style.width =
        porcentagem + "%";


    /* ==========================
       ATUALIZAR CADA MÓDULO
    ========================== */

    let numeroInicial = 1;


    modulos.forEach(modulo => {

        const inicio =
            numeroInicial;

        const fim =
            numeroInicial +
            modulo.aulas.length -
            1;


        let feitas = 0;


        for(
            let numero = inicio;
            numero <= fim;
            numero++
        ){

            if(
                concluida.includes(numero)
            ){

                feitas++;

            }

        }


        const porcentagemModulo =
            modulo.aulas.length === 0
            ? 0
            : Math.round(
                (feitas /
                modulo.aulas.length) *
                100
            );


        const elemento =
            document.getElementById(
                `prog-${modulo.id}`
            );


        if(elemento){

            elemento.textContent =
                `${porcentagemModulo}%`;

        }


        numeroInicial =
            fim + 1;

    });


    /* ==========================
       MARCAR AULAS CONCLUÍDAS
    ========================== */

    document
        .querySelectorAll(".assunto")
        .forEach(item => {

            const aula =
                Number(
                    item.dataset.aula
                );


            if(
                concluida.includes(aula)
            ){

                item.classList.add(
                    "concluida"
                );

            }else{

                item.classList.remove(
                    "concluida"
                );

            }

        });

}

    erro.style.display =
